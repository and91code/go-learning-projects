services:
  # Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: taskflow_mysql-01
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: taskflow_db
      MYSQL_USER: taskflow_user
      MYSQL_PASSWORD: taskflow_password
    ports:
      - "3306:3306"
    volumes:
      - ./.data/mysql_data:/var/lib/mysql
      - ./backend/migrations/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - taskflow_network

  # Backend em Go
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow_backend-01
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: taskflow_user
      DB_PASSWORD: taskflow_password
      DB_NAME: taskflow_db
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me}
    volumes:
      - ./backend:/app
    depends_on:
      - db
    networks:
      - taskflow_network

  # Frontend em React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow_frontend-01
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - taskflow_network

volumes:
  frontend_node_modules:

networks:
  taskflow_network:
    driver: bridge
