services:
  redisinsight:
    image: redis/redisinsight:latest
    container_name: taskflow_redisinsight
    ports:
      - "5540:5540"
    restart: always
    depends_on:
      - redis
    networks:
      - taskflow_network
  # Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: taskflow_mysql-03
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: taskflow_db
      MYSQL_USER: taskflow_user
      MYSQL_PASSWORD: taskflow_password
    ports:
      - "3306:3306"
    volumes:
      - ./.data/mysql_data:/var/lib/mysql
      - ./backend/migrations/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - taskflow_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - taskflow_network

  # Backend em Go
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow_backend-03
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_DSN: taskflow_user:taskflow_password@tcp(db:3306)/taskflow_db?parseTime=true
      REDIS_URL: redis://redis:6379
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: taskflow_user
      DB_PASSWORD: taskflow_password
      DB_NAME: taskflow_db
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - taskflow_network

  # Frontend em React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow_frontend-03
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - taskflow_network

volumes:
  frontend_node_modules:
  redis_data:

networks:
  taskflow_network:
    driver: bridge
